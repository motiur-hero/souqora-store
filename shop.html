<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop All Products | Souqora</title>
<meta name="description" content="Browse Souqora products. Search, filter by category and price, and sort by newest, best sellers or price.">
<link rel="canonical" href="https://souqora.live/shop.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Souqora">
<meta property="og:title" content="Shop All Products | Souqora">
<meta property="og:description" content="Browse Souqora products. Search, filter by category and price, and sort by newest, best sellers or price.">
<meta property="og:url" content="https://souqora.live/shop.html">
<meta property="og:image" content="https://souqora.live/assets/images/og.png">
<link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Tailwind Play CDN: fine for launch on GitHub Pages. See README for the optional compiled build. -->
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#0F4C3A',dark:'#0A3628'},saffron:'#E8A317',ink:'#12211B',paper:'#F7F8F6'}}}}</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop" class="bg-paper text-ink">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:bg-white focus:p-2">Skip to content</a>
<div id="site-header"></div>
<main id="main">
<div class="max-w-7xl mx-auto px-4 py-10"><h1 class="text-3xl font-bold mb-6">Shop</h1>
<div class="grid md:grid-cols-4 gap-6"><form class="space-y-4 md:sticky md:top-24 h-fit" onsubmit="return false" aria-label="Filters">
  <div><label class="block text-sm font-medium mb-1" for="q">Search</label><input id="q" type="search" class="field" placeholder="Search products"></div>
  <div><label class="block text-sm font-medium mb-1" for="cat">Category</label><select id="cat" class="field"></select></div>
  <div><label class="block text-sm font-medium mb-1" for="sort">Sort by</label><select id="sort" class="field"><option value="featured">Featured</option><option value="newest">Newest</option><option value="best">Best sellers</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option></select></div>
  <div><span class="block text-sm font-medium mb-1">Price (SAR)</span><div class="flex gap-2"><input id="min" type="number" min="0" class="field" placeholder="Min" aria-label="Minimum price"><input id="max" type="number" min="0" class="field" placeholder="Max" aria-label="Maximum price"></div></div></form>
<div class="md:col-span-3"><p id="count" class="text-sm text-slate-600 mb-3" aria-live="polite"></p><div id="grid" class="grid grid-cols-2 lg:grid-cols-3 gap-4"></div></div></div></div>
</main>
<div id="site-footer"></div>
<script src="js/config.js"></script><script src="js/square.js"></script><script src="js/products.js"></script>
<script src="js/cart.js"></script><script src="js/checkout.js"></script><script src="js/app.js"></script>
</body>
</html>
